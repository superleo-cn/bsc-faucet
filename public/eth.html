<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ethereum Faucet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← Back to Networks</a>
    <h1>Ethereum Faucet</h1>
    
    <section class="balance-section">
      <div class="balance-section-title">Faucet Balance</div>
      <div class="balance-item">
        <span class="balance-label">ETH:</span>
        <span class="balance-value" id="balanceNative">Loading...</span>
      </div>
      <div class="balance-item">
        <span class="balance-label">Token:</span>
        <span class="balance-value" id="balanceToken">Loading...</span>
      </div>
      <button id="refreshBtn" class="refresh-btn">Refresh Balance</button>
    </section>
    
    <p class="description">
      Enter your Ethereum address to claim test tokens. Each address can claim once every 24 hours.
    </p>
    
    <form id="claimForm">
      <input id="address" type="text" placeholder="0x..." required pattern="0x[0-9a-fA-F]{40}" />
      <button type="submit">Claim Tokens</button>
    </form>
    
    <div id="status" class="status-box"></div>
  <script>
    const ERROR_MESSAGES = {
      'invalid_address': 'Invalid Ethereum address. Please check and try again.',
      'cooldown': 'You already claimed recently. Please wait.',
      'insufficient_gas': 'Faucet balance insufficient for gas fees. Please try again later.',
      'insufficient_balance': 'Faucet token balance insufficient. Please try again later.',
      'internal': 'An unexpected error occurred. Please try again later.',
      'network_error': 'Network error. Please check your connection and try again.'
    };

    async function loadStatus() {
      try {
        const r = await fetch('/api/eth/status');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        const native = BigInt(data.nativeBalance);
        const nativeStr = (Number(native)/1e18).toFixed(6);
        document.getElementById('balanceNative').textContent = nativeStr + ' ETH';
        if (data.token) {
          if (data.token.balance) {
            const dec = data.token.decimals || 18;
            const bal = BigInt(data.token.balance);
            const human = Number(bal) / 10 ** dec;
            document.getElementById('balanceToken').textContent = human.toFixed(4) + ' (' + data.token.address + ')';
          } else {
            document.getElementById('balanceToken').textContent = 'No balance or unavailable';
          }
        } else {
          document.getElementById('balanceToken').textContent = 'Not configured';
        }
      } catch (err) {
        document.getElementById('balanceNative').textContent = 'Failed to load';
        document.getElementById('balanceToken').textContent = 'Failed to load';
      }
    }
    
    document.getElementById('refreshBtn').addEventListener('click', loadStatus);
    loadStatus();
    setInterval(loadStatus, 30000);

    const form = document.getElementById('claimForm');
    const statusBox = document.getElementById('status');

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = 'status-box show ' + type;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const address = document.getElementById('address').value.trim();
      showStatus('Processing...', 'info');
      
      try {
        const r = await fetch('/eth/claim', { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ address }) 
        });
        const json = await r.json();
        
        if (r.status === 201) {
          const dec = json.decimals || 18;
          let human;
          try {
            const raw = BigInt(json.amount);
            const factor = 10n ** BigInt(dec);
            const whole = raw / factor;
            const frac = raw % factor;
            if (frac === 0n) {
              human = whole.toString();
            } else {
              const fracStr = (frac + factor).toString().slice(1).padStart(dec,'0').replace(/0+$/,'');
              human = whole.toString() + '.' + fracStr.slice(0, Math.min(6, fracStr.length));
            }
          } catch { 
            human = json.amountTokens?.toString() || '?'; 
          }
          showStatus('✓ Claim successful!\nAmount: ' + human + '\nTx Hash: ' + json.txHash, 'success');
        } else if (r.status === 429 && json.error === 'cooldown') {
          const remainSec = Math.round((json.remainingMs || 0) / 1000);
          const hours = Math.floor(remainSec / 3600);
          const mins = Math.floor((remainSec % 3600) / 60);
          const secs = remainSec % 60;
          let timeStr = '';
          if (hours > 0) timeStr += hours + 'h ';
          if (mins > 0) timeStr += mins + 'm ';
          timeStr += secs + 's';
          showStatus('You already claimed recently.\nPlease wait ~' + timeStr + ' before claiming again.', 'error');
        } else {
          const errorCode = json.error || 'internal';
          const message = ERROR_MESSAGES[errorCode] || ERROR_MESSAGES['internal'];
          showStatus('✗ ' + message, 'error');
        }
      } catch (err) {
        showStatus('✗ ' + ERROR_MESSAGES['network_error'], 'error');
      }
    });
  </script>
  
  <footer>
    For testing purposes only. Never enter production private keys. | 
    <a href="/eth/healthz" target="_blank">Health Check</a> | 
    <a href="/keygen.html">Generate Keys</a>
  </footer>
</div>
</body>
</html>
